{% extends "base.html" %}
{% block title %}Ping{% endblock %}
{% block content %}
<h2>Ping Utility</h2>
<form method="GET">
  <input type="text" name="host" value="{{ host }}" placeholder="e.g. 127.0.0.1 or example.com">
  <input type="submit" value="Ping">
</form>
{% if output %}
<h3>Output:</h3>
<pre>{{ output }}</pre>
{% endif %}
{% endblock %}
